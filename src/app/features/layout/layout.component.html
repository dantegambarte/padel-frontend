<div *ngIf="unclosedSessionDate" class="fixed inset-0 z-50 flex items-center justify-center p-4">
  <div class="absolute inset-0 bg-black/50" aria-hidden="true"></div>

  <div role="alertdialog" aria-modal="true" aria-labelledby="unclosed-title"
    class="relative z-10 w-full max-w-md rounded-xl border border-amber-200 bg-white shadow-2xl p-6">
    <div class="flex items-start gap-4">
      <div class="flex-shrink-0 rounded-full bg-amber-100 p-2.5">
        <svg class="h-6 w-6 text-amber-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
          <line x1="12" y1="9" x2="12" y2="13" />
          <line x1="12" y1="17" x2="12.01" y2="17" />
        </svg>
      </div>
      <div class="flex-1">
        <h2 id="unclosed-title" class="text-base font-semibold text-gray-900">
          Caja sin cerrar
        </h2>
        <p class="mt-1 text-sm text-gray-600">
          La jornada del
          <span class="font-semibold text-amber-700">
            {{ formatUnclosedDate(unclosedSessionDate) }}
          </span>
          todavía está abierta. Realizá el cierre antes de continuar para que los
          movimientos queden correctamente registrados.
        </p>
      </div>
    </div>

    <div class="mt-5 flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
      <button type="button" (click)="unclosedSessionDate = null"
        class="inline-flex justify-center rounded-md border border-input bg-background px-4 py-2 text-sm font-medium hover:bg-accent transition-colors">
        Recordármelo después
      </button>
      <button type="button" (click)="goToCashRegister()"
        class="inline-flex justify-center rounded-md bg-amber-500 px-4 py-2 text-sm font-semibold text-white hover:bg-amber-600 transition-colors">
        Ir a Cierre de Caja
      </button>
    </div>
  </div>
</div>

<div class="flex h-screen overflow-hidden bg-background">
  <app-sidebar [isOpen]="isSidebarOpen" (closeMenu)="isSidebarOpen = false"></app-sidebar>

  <div class="flex flex-col flex-1 min-w-0">
    <app-toolbar [title]="currentPageTitle" [currentUser]="currentUser" (toggleMenu)="toggleSidebar()"></app-toolbar>

    <main class="flex-1 overflow-y-auto p-4 md:p-6">
      <div class="mx-auto max-w-7xl">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>
</div>
