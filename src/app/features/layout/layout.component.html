<!-- Mobile First responsive layout — off-canvas sidebar + sticky toolbar -->
<div class="flex h-screen overflow-hidden bg-background">
  <!-- Sidebar — off-canvas drawer on mobile, static column on lg+ -->
  <app-sidebar
    [isOpen]="isSidebarOpen"
    (closeMenu)="isSidebarOpen = false"
  ></app-sidebar>

  <!-- Main area: toolbar + scrollable content -->
  <div class="flex flex-col flex-1 min-w-0 overflow-hidden">
    <!-- Toolbar sticky at the top -->
    <app-toolbar
      [title]="currentPageTitle"
      [currentUser]="currentUser"
      (toggleMenu)="toggleSidebar()"
    ></app-toolbar>

    <!-- Active page content via router-outlet -->
    <main class="flex-1 overflow-y-auto p-4 md:p-6">
      <div class="mx-auto max-w-7xl">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>
</div>
