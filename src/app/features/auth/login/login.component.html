<div
  class="flex min-h-[100dvh] w-full items-center justify-center bg-gradient-to-br from-muted to-background p-6"
>
  <div class="w-full max-w-md">
    <div
      class="rounded-lg border border-border bg-card text-card-foreground shadow-lg"
    >
      <div class="flex flex-col space-y-1.5 p-6">
        <div class="flex items-center justify-center mb-4">
          <div
            class="h-24 w-24 rounded-lg bg-primary flex items-center justify-center shadow-md"
          >
            <img
              src="assets/imagen.png"
              alt="La Caldera Logo"
              class="h-16 w-16"
            />
          </div>
        </div>

        <h3
          class="text-3xl text-center font-bold tracking-tight text-card-foreground"
        >
          La Caldera
        </h3>
        <p class="text-center text-base text-muted-foreground">
          Sistema de Gestión de Canchas de Pádel
        </p>
      </div>

      <div class="p-6 pt-0">
        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
          <div class="space-y-2">
            <label
              for="username"
              class="text-sm font-medium leading-none text-card-foreground peer-disabled:cursor-not-allowed peer-disabled:opacity-70"
            >
              Usuario
            </label>
            <input
              id="username"
              type="text"
              formControlName="username"
              placeholder="Ingrese su usuario"
              autocomplete="username"
              class="flex h-11 w-full rounded-md border border-input bg-background px-3 py-2 text-sm ring-offset-background placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50"
            />
          </div>

          <div class="space-y-2">
            <label
              for="password"
              class="text-sm font-medium leading-none text-card-foreground peer-disabled:cursor-not-allowed peer-disabled:opacity-70"
            >
              Contraseña
            </label>
            <input
              id="password"
              type="password"
              formControlName="password"
              placeholder="Ingrese su contraseña"
              autocomplete="current-password"
              class="flex h-11 w-full rounded-md border border-input bg-background px-3 py-2 text-sm ring-offset-background placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50"
            />
            <p
              *ngIf="form.get('password')?.errors?.['minlength'] && form.get('password')?.touched"
              class="text-xs text-destructive mt-1"
            >
              * Mínimo 6 caracteres
            </p>
          </div>

          <div
            *ngIf="errorMessage"
            class="flex items-center gap-2 p-3 bg-destructive/10 border border-destructive/20 rounded-lg text-destructive text-sm"
          >
            <svg
              class="h-4 w-4 flex-shrink-0"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="10" />
              <line x1="12" y1="8" x2="12" y2="12" />
              <line x1="12" y1="16" x2="12.01" y2="16" />
            </svg>
            <span>{{ errorMessage }}</span>
          </div>

          <button
            type="submit"
            [disabled]="form.invalid || isLoading"
            class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-base font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-primary text-primary-foreground hover:bg-primary/90 h-12 w-full px-8"
          >
            <ng-container *ngIf="isLoading; else elseLogin">
              <svg
                class="mr-2 h-4 w-4 animate-spin"
                viewBox="0 0 24 24"
                fill="none"
              >
                <circle
                  class="opacity-25"
                  cx="12"
                  cy="12"
                  r="10"
                  stroke="currentColor"
                  stroke-width="4"
                />
                <path
                  class="opacity-75"
                  fill="currentColor"
                  d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"
                />
              </svg>
              Iniciando sesión...
            </ng-container>
            <ng-template #elseLogin> Iniciar Sesión </ng-template>
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
