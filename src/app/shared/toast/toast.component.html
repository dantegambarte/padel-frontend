
<div
  class="fixed bottom-4 right-4 z-[200] flex flex-col gap-2"
  style="width: 360px; max-width: calc(100vw - 2rem)"
  aria-live="polite"
  aria-label="Notificaciones"
>
  <div *ngFor="let toast of toasts" [class]="toastClass(toast.variant)">
    
    <div class="mt-0.5 flex-shrink-0" [ngSwitch]="toast.variant">
      <svg
        *ngSwitchCase="'success'"
        class="h-5 w-5 text-accent"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
        <path d="m9 11 3 3L22 4" />
      </svg>
      <svg
        *ngSwitchCase="'destructive'"
        class="h-5 w-5 text-destructive"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="12" cy="12" r="10" />
        <line x1="12" y1="8" x2="12" y2="12" />
        <line x1="12" y1="16" x2="12.01" y2="16" />
      </svg>
      <svg
        *ngSwitchDefault
        class="h-5 w-5 text-muted-foreground"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="12" cy="12" r="10" />
        <path d="M12 16v-4" />
        <path d="M12 8h.01" />
      </svg>
    </div>

    <div class="flex-1 min-w-0">
      <p class="text-sm font-semibold leading-tight">{{ toast.title }}</p>
      <p *ngIf="toast.description" class="mt-0.5 text-sm opacity-90">
        {{ toast.description }}
      </p>
    </div>

    <button
      type="button"
      (click)="dismiss(toast.id)"
      class="flex-shrink-0 rounded-md p-0.5 opacity-70 hover:opacity-100 transition-opacity focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring"
      aria-label="Cerrar notificación"
    >
      <svg
        class="h-4 w-4"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M18 6 6 18" />
        <path d="m6 6 12 12" />
      </svg>
    </button>
  </div>
</div>
