# Configuración de pnpm. Desde pnpm 11 estas opciones viven acá y NO en el
# campo `pnpm` del package.json (ahí se ignoran en silencio).

# pnpm bloquea los scripts de postinstall por defecto. Estos cuatro compilan o
# descargan binarios nativos y sin ellos el build de Angular no funciona.
allowBuilds:
  esbuild: true # motor de compilación del builder `application`
  lmdb: true # caché de build de Angular
  msgpackr-extract: true # serialización de esa caché
  '@parcel/watcher': true # watcher de `ng serve`
